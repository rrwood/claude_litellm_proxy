model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true

  - model_name: claude-opus-4-7
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true

# Direct Gemini access
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      drop_params: true

litellm_settings:
  drop_params: true

general_settings:
  master_key: DUMMY_KEY
  # Default model when client doesn't specify one
  default_model: claude-haiku-4-5-20251001
  # SQLite database for Admin UI support (only for UI-enabled deployments)
  # Uncomment for docker-compose.external-network.yml (Debian with UI)
  # database_url: "sqlite:////home/litellm/.config/litellm/litellm.db"
