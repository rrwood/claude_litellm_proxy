# Model mappings. Pulled from GitHub on container startup (CONFIG_REPO_URL).
# To change: edit, push, restart the container.
#
# Each Claude tier falls back: primary (NIM) -> backup (NIM, different vendor) -> fallback (OpenRouter).
# Last tested: 2026-11-06 (tool use + multi-turn).

model_list:
  # --- Opus tier ---------------------------------------------------------
  - model_name: claude-opus-5
    litellm_params: &opus
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true
  - model_name: claude-opus-5-5
    litellm_params: *opus
  - model_name: claude-fable-5-1
    litellm_params: *opus
  - model_name: claude-opus-4-7
    litellm_params: *opus

  # --- Sonnet tier -------------------------------------------------------
  - model_name: claude-sonnet-5
    litellm_params: &sonnet
      model: nvidia_nim/nvidia/nemotron-3.5-super-vl-120b-a12b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true
  - model_name: claude-sonnet-5-5
    litellm_params: *sonnet
  - model_name: claude-sonnet-4-6
    litellm_params: *sonnet

  # --- Haiku tier --------------------------------------------------------
  - model_name: claude-haiku-4-5
    litellm_params: &haiku
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true
  - model_name: claude-haiku-5-5
    litellm_params: *haiku
  - model_name: claude-haiku-4-5-20251001
    litellm_params: *haiku

  # --- Backup (NIM, different vendor; slower) ----------------------------
  - model_name: backup
    litellm_params:
      model: nvidia_nim/mistralai/mistral-large-4-1t-a52b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true

  # --- Fallback (OpenRouter free router; independent of NIM) -------------
  # openrouter/free picks whichever free model is available, so it does not
  # go stale when individual free models are retired.
  - model_name: fallback
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true

  # --- Direct Gemini access ----------------------------------------------
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      drop_params: true

  # --- Fallback check ----------------------------------------------------
  # Points at a model that does not exist, so every request should be served
  # by the fallback chain. Use it to confirm fallbacks still work.
  - model_name: fallback-check
    litellm_params:
      model: nvidia_nim/does-not-exist/fallback-check
      api_key: os.environ/NVIDIA_NIM_API_KEY
      drop_params: true

litellm_settings:
  drop_params: true
  fallbacks:
    - claude-opus-5: [backup, fallback]
    - claude-opus-5-5: [backup, fallback]
    - claude-fable-5-1: [backup, fallback]
    - claude-opus-4-7: [backup, fallback]
    - claude-sonnet-5: [backup, fallback]
    - claude-sonnet-5-5: [backup, fallback]
    - claude-sonnet-4-6: [backup, fallback]
    - claude-haiku-4-5: [backup, fallback]
    - claude-haiku-5-5: [backup, fallback]
    - claude-haiku-4-5-20251001: [backup, fallback]
    - backup: [fallback]
    - fallback-check: [backup, fallback]

general_settings:
  master_key: DUMMY_KEY
  default_model: claude-haiku-4-5
